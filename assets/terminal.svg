<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240">
  <style>
    text { font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace; font-size: 15px; }
    .prompt { fill: #E01E1E; font-weight: 700; }
    .cmd { fill: #ffffff; }
    .out { fill: #9be9a8; }
    .reveal { clip-path: inset(0 100% 0 0); }
    @keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    .l1 { animation: type 1.1s steps(24) 0.2s forwards; }
    .r1 { animation: type 0.9s steps(43) 1.5s forwards; }
    .l2 { animation: type 0.8s steps(16) 2.5s forwards; }
    .r2 { animation: type 0.9s steps(43) 3.5s forwards; }
    .l3 { animation: type 0.8s steps(17) 4.5s forwards; }
    .r3 { animation: type 0.9s steps(29) 5.5s forwards; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cursor { animation: blink 1s step-end infinite; fill: #E01E1E; }
  </style>

  <rect x="1" y="1" width="798" height="238" rx="10" fill="#0d1117" stroke="#E01E1E" stroke-opacity="0.6"/>
  <rect x="1" y="1" width="798" height="30" rx="10" fill="#161b22"/>
  <rect x="1" y="20" width="798" height="11" fill="#161b22"/>
  <circle cx="20" cy="16" r="6" fill="#f85149"/>
  <circle cx="40" cy="16" r="6" fill="#d29922"/>
  <circle cx="60" cy="16" r="6" fill="#238636"/>
  <text x="400" y="21" text-anchor="middle" fill="#8b949e" font-size="12">xaferima@kali — zsh</text>

  <text x="22" y="62" class="prompt">xaferima@kali:~$</text>
  <text x="152" y="62" class="cmd reveal l1">whoami</text>

  <text x="22" y="94" class="out reveal r1">Xavier Riofrío — Offensive Security Expert | Ex-CERN</text>

  <text x="22" y="126" class="prompt">$</text>
  <text x="38" y="126" class="cmd reveal l2">cat talks.txt</text>

  <text x="22" y="158" class="out reveal r2">DEF CON 34 · BSides Colombia · PWN OR DIE</text>

  <text x="22" y="190" class="prompt">$</text>
  <text x="38" y="190" class="cmd reveal l3">nmap -sV xavier</text>

  <text x="22" y="222" class="out reveal r3">1337/tcp open  hacking  v10</text>

  <rect x="318" y="212" width="9" height="16" class="cursor"/>
</svg>
